<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev Support Router</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --accent: #4f46e5; --p1: #dc2626; --p2: #ea580c; --p3: #ca8a04; --p4: #6b7280;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 20px 32px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 18px; margin: 0; }
  #status { font-size: 12px; color: var(--muted); margin-left: auto; }
  main { max-width: 1200px; margin: 24px auto; padding: 0 24px; display: grid; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
  textarea { min-height: 90px; resize: vertical; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tr.ticket { cursor: pointer; }
  tr.ticket:hover { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eef2ff; color: var(--accent); }
  .P1 { background: #fee2e2; color: var(--p1); } .P2 { background: #ffedd5; color: var(--p2); }
  .P3 { background: #fef9c3; color: var(--p3); } .P4 { background: #f3f4f6; color: var(--p4); }
  .esc { background: #fee2e2; color: var(--p1); }
  .muted { color: var(--muted); font-size: 12px; }
  .msg { max-width: 420px; }
  .detail td { background: #fafafa; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .bar { display: grid; grid-template-columns: 90px 1fr 42px; align-items: center; gap: 8px; font-size: 12px; margin: 3px 0; }
  .bar div { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .error { color: var(--p1); }
  h3 { font-size: 13px; margin: 0 0 6px; }
  ul { margin: 0; padding-left: 18px; }
</style>
</head>
<body>
<header>
  <h1>⚡ Jev Support Router</h1>
  <span class="muted">Typed decisions from TypeSafe's System One model, with routing rules in code</span>
  <span id="status">checking…</span>
</header>

<main>
  <section class="card">
    <div class="row" style="margin-bottom:10px">
      <input id="subject" placeholder="Subject (optional)" style="flex:1" />
      <input id="customer" placeholder="Customer / plan (optional)" style="flex:1" />
    </div>
    <textarea id="message" placeholder="Paste a customer support message…"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="primary" id="routeBtn">Route ticket</button>
      <button id="samplesBtn">Route 10 sample tickets</button>
      <button id="clearBtn">Clear</button>
      <span id="error" class="error"></span>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="card">
    <table>
      <thead><tr><th>Ticket</th><th>Queue</th><th>Priority</th><th>Urgency</th><th>Sentiment</th><th>Flags</th><th>Latency</th></tr></thead>
      <tbody id="rows"><tr><td colspan="7" class="muted">No tickets routed yet.</td></tr></tbody>
    </table>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (p) => `${Math.round(p * 100)}%`;
let tickets = [];
const open = new Set();

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || res.statusText);
  return body;
}

function bars(probs) {
  return Object.entries(probs).sort((a, b) => b[1] - a[1]).map(([k, p]) =>
    `<div class="bar"><span>${esc(k)}</span><div><i style="width:${pct(p)}"></i></div><span>${pct(p)}</span></div>`).join("");
}

function renderStats() {
  const n = tickets.length;
  const avg = n ? tickets.reduce((s, t) => s + t.latency_ms, 0) / n : 0;
  const count = (f) => tickets.filter(f).length;
  const items = [
    ["Tickets", n], ["P1 / P2", count((t) => t.priority === "P1" || t.priority === "P2")],
    ["Escalated", count((t) => t.escalate)], ["Needs triage", count((t) => t.queue === "triage")],
    ["Spam caught", count((t) => t.queue === "spam")], ["Avg Jev latency", n ? `${Math.round(avg)} ms` : "–"],
  ];
  $("stats").innerHTML = items.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join("");
}

function render() {
  renderStats();
  if (!tickets.length) {
    $("rows").innerHTML = `<tr><td colspan="7" class="muted">No tickets routed yet.</td></tr>`;
    return;
  }
  $("rows").innerHTML = tickets.map((t) => {
    const s = t.signals;
    const flags = [
      t.escalate && `<span class="badge esc">escalate</span>`,
      s.churn_risk >= 0.5 && `<span class="badge">churn ${pct(s.churn_risk)}</span>`,
    ].filter(Boolean).join(" ");
    const row = `<tr class="ticket" data-id="${t.id}">
      <td class="msg"><b>${esc(t.subject || "(no subject)")}</b><br><span class="muted">${esc(t.customer || "")}</span>
        <div>${esc(t.message.slice(0, 140))}${t.message.length > 140 ? "…" : ""}</div></td>
      <td><span class="badge">${esc(t.queue)}</span><br><span class="muted">${pct(s.team.confidence)} conf.</span></td>
      <td><span class="badge ${t.priority}">${t.priority}</span></td>
      <td>${esc(s.urgency.level)}<br><span class="muted">${s.urgency.score.toFixed(2)} / 3</span></td>
      <td>${esc(s.sentiment.level)}<br><span class="muted">${s.sentiment.score.toFixed(2)} / 3</span></td>
      <td>${flags || '<span class="muted">–</span>'}</td>
      <td class="muted">${Math.round(t.latency_ms)} ms</td></tr>`;
    const detail = !open.has(t.id) ? "" : `<tr class="detail"><td colspan="7"><div class="grid">
      <div><h3>Team</h3>${bars(s.team.probabilities)}</div>
      <div><h3>Urgency</h3>${bars(s.urgency.probabilities)}</div>
      <div><h3>Sentiment</h3>${bars(s.sentiment.probabilities)}</div>
      <div><h3>Yes/No signals</h3>${bars({ "churn risk": s.churn_risk, "needs human": s.needs_human, "spam": s.is_spam })}</div>
      <div><h3>Why this routing</h3><ul>${t.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>
        <p class="muted">model ${esc(t.model)} · request ${esc(t.request_id || "–")}</p></div>
    </div></td></tr>`;
    return row + detail;
  }).join("");
  document.querySelectorAll("tr.ticket").forEach((tr) => tr.onclick = () => {
    open.has(tr.dataset.id) ? open.delete(tr.dataset.id) : open.add(tr.dataset.id);
    render();
  });
}

async function withBusy(fn) {
  $("error").textContent = "";
  document.querySelectorAll("button").forEach((b) => b.disabled = true);
  try { await fn(); } catch (e) { $("error").textContent = e.message; }
  finally { document.querySelectorAll("button").forEach((b) => b.disabled = false); }
}

$("routeBtn").onclick = () => withBusy(async () => {
  const message = $("message").value.trim();
  if (!message) throw new Error("Enter a message first.");
  const t = await api("/api/tickets", { method: "POST", body: JSON.stringify({
    message, subject: $("subject").value.trim() || null, customer: $("customer").value.trim() || null }) });
  tickets.unshift(t); open.add(t.id); $("message").value = ""; render();
});

$("samplesBtn").onclick = () => withBusy(async () => {
  const samples = await api("/api/samples");
  const routed = await api("/api/tickets/batch", { method: "POST", body: JSON.stringify({ tickets: samples }) });
  tickets = [...routed, ...tickets]; render();
});

$("clearBtn").onclick = () => withBusy(async () => {
  await api("/api/tickets", { method: "DELETE" }); tickets = []; open.clear(); render();
});

(async () => {
  try {
    const s = await api("/api/status");
    $("status").innerHTML = s.jev_configured ? `● connected · ${esc(s.model)}`
      : `<span class="error">● TYPESAFE_API_KEY not set in .env</span>`;
    tickets = await api("/api/tickets");
  } catch (e) { $("status").textContent = "backend unreachable"; }
  render();
})();
</script>
</body>
</html>
